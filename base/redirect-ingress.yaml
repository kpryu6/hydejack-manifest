# kpryu.sytes.net -> kpryu.cloud 영구 리다이렉트.
# 실제 301 은 hydejack 컨테이너 nginx(nginx/default.conf)가 Host 헤더를 보고 수행한다.
# (ingress-nginx 의 permanent-redirect 어노테이션은 $request_uri 를 값 검증에서 거부함)
# 기존 HTTP-01 인증서(letsencrypt-prod)를 그대로 갱신해 https 로도 리다이렉트된다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: legacy-redirect
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - kpryu.sytes.net
      secretName: kpryu-tls-secret
  rules:
    - host: kpryu.sytes.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hydejack-service
                port:
                  number: 80

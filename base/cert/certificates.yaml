# Ingress 가 있는 네임스페이스마다 하나씩. 둘 다 같은 와일드카드를 발급받는다.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kpryu-cloud-tls
  namespace: default
spec:
  secretName: kpryu-cloud-tls
  issuerRef:
    name: letsencrypt-dns01
    kind: ClusterIssuer
  dnsNames:
    - kpryu.cloud
    - "*.kpryu.cloud"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kpryu-cloud-tls
  namespace: homepage
spec:
  secretName: kpryu-cloud-tls
  issuerRef:
    name: letsencrypt-dns01
    kind: ClusterIssuer
  dnsNames:
    - kpryu.cloud
    - "*.kpryu.cloud"
